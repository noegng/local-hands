name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.8"}
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.9"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite (standard library only, nothing to install)
        run: python -B -W ignore -m unittest discover -s tests -v
